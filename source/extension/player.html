<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂二维码提醒</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><div><span class="eyebrow">CLASSROOM WATCH</span><h1>课堂二维码提醒</h1></div><span id="badge" class="badge">待开始</span></header>
  <form id="form"><label for="url">课堂直播地址</label><div class="input-row"><input id="url" type="url" required placeholder="粘贴完整的 http(s)://…/live.m3u8 地址" autocomplete="off"><button id="start" type="submit">开始监控</button></div></form>
  <div class="video-box"><video id="video" controls muted playsinline></video><div id="placeholder">粘贴直播地址，开始守候二维码</div></div>
  <section class="status-grid"><div><label>二维码检测</label><p id="status" role="status" aria-live="polite">尚未连接</p></div><div><label>直播播放</label><p id="playback">未播放</p></div><div><label>最近检测时间</label><p id="last-frame">—</p></div></section>
  <div id="alert" class="alert" hidden><strong>检测到课堂签到二维码</strong><p id="detected-at"></p><p id="effects"></p><details><summary>查看首次检测的二维码内容（可能已刷新）</summary><p>此处保留首次签到提醒结果。所有后续识别内容请查看二维码日志；动态二维码可能已刷新。</p><pre id="qr"></pre></details></div>
  <div id="error" class="error" role="alert" hidden></div>
  <div class="controls"><button id="mute" class="secondary" disabled>停止响铃</button><button id="unpin" class="secondary" disabled>取消置顶</button><button id="rearm" class="secondary" disabled>重新监控</button><button id="test" class="secondary">试播提醒音</button><button id="stop" class="danger" disabled>停止监控</button></div>
  <footer>每次监控仅对签到码提醒一次 · 其他码只记日志 · 直播默认静音 · 二维码仅在本机处理<br><span id="host-info">需要安装 Windows 本地辅助程序。</span></footer>
</main><script src="player.js"></script></body></html>
